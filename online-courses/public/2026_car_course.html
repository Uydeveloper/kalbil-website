<!DOCTYPE html>
<html lang="ug" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QML 2026 — كىۋانىت ماشىنا ئۆگىنىشى يول خەرىتىسى</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=UKIJ+Chemen:wght@400;700&display=swap');
        body {
            font-family: 'UKIJ Chemen', ui-sans-serif, system-ui, sans-serif;
        }
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 transition-colors duration-300">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ئاددىي ھەم چىرايلىق SVG سىنبەلگىلەر
        const Icons = {
            Zap: () => <svg className="w-5 h-5 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>,
            Sun: () => <svg className="w-5 h-5 text-yellow-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M12 5a7 7 0 100 14 7 7 0 000-14z" /></svg>,
            Moon: () => <svg className="w-5 h-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>,
            Atom: () => <svg className="w-12 h-12 text-cyan-400 animate-spin-slow" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="1.5"><path strokeLinecap="round" strokeLinejoin="round" d="M12 8v8m4-4H8m13.254-2.185a10 10 0 11-18.508 0 10 10 0 0118.508 0z" /></svg>,
            ChevronLeft: () => <svg className="w-4 h-4 text-cyan-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M15 19l-7-7 7-7" /></svg>
        };

        const QuantumRoadmap2026 = () => {
            const [darkMode, setDarkMode] = useState(true);
            const [activeSection, setActiveSection] = useState('prerequisites');
            const [submitted, setSubmitted] = useState(false);
            const [formData, setFormData] = useState({
                name: '', email: '', telegram: '', whatsapp: '',
                level: 'beginner', paymentMethod: 'crypto'
            });
            const canvasRef = useRef(null);

            const toggleTheme = () => {
                setDarkMode(!darkMode);
                document.body.className = darkMode ? "bg-gray-50 text-gray-900 transition-colors duration-300" : "bg-gray-950 text-gray-100 transition-colors duration-300";
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                // سىناق ھالەتتە بىۋاسىتە مۇۋەپپەقىيەتلىك دەپ كۆرسىتىدۇ
                setSubmitted(true);
                setTimeout(() => setSubmitted(false), 5000);
            };

            // زەررىچە ئېففېكتى (Canvas Animation)
            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let particles = [];
                let animationId;

                const resize = () => {
                    canvas.width = canvas.offsetWidth;
                    canvas.height = canvas.offsetHeight;
                };

                const init = () => {
                    particles = [];
                    for (let i = 0; i < 60; i++) {
                        particles.push({
                            x: Math.random() * canvas.width,
                            y: Math.random() * canvas.height,
                            vx: (Math.random() - 0.5) * 0.5,
                            vy: Math.random() * 0.5 + 0.2,
                            size: Math.random() * 2 + 1
                        });
                    }
                };

                const loop = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = darkMode ? 'rgba(34, 211, 238, 0.2)' : 'rgba(147, 51, 234, 0.15)';
                    particles.forEach(p => {
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                        p.x += p.vx;
                        p.y += p.vy;
                        if (p.y > canvas.height) p.y = 0;
                        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                    });
                    animationId = requestAnimationFrame(loop);
                };

                resize();
                init();
                loop();
                window.addEventListener('resize', () => { resize(); init(); });
                return () => cancelAnimationFrame(animationId);
            }, [darkMode]);

            const roadmap = [
                {
                    id: 'prerequisites',
                    title: '0️⃣ ئالدىنقى تەييارلىق (Prerequisites)',
                    topics: [
                        { category: '🔹 ماتېماتىكا ئاساسى', items: ['Linear Algebra (سىزىقلىق ئالگېبرا)', 'Probability & Statistics (ېھتىماللىق دەرىسى)', 'Calculus (ماتېماتىكا ئانالىز)'] },
                        { category: '🔹 پروگراممىلىق ئاساس', items: ['Python تىلى ئاساسى', 'NumPy, SciPy كۇتۇپخانىلىرى', 'Jupyter Notebook ئەتراپى'] }
                    ]
                },
                {
                    id: 'classical-ml',
                    title: '1️⃣ كىلاسسىك ماشىنا ئۆگىنىش',
                    topics: [
                        { category: '🔹 ئەنئەنىۋى مودېللار', items: ['Linear/Logistic Regression', 'SVM (Support Vector Machine)', 'Random Forest'] },
                        { category: '🔹 نېرۋا تورى ئاساسى', items: ['Perceptron, MLP قۇرۇلمىسى', 'Activation Functions', 'Backpropagation ئالگورىزىمى'] }
                    ]
                },
                {
                    id: 'quantum-foundations',
                    title: '2️⃣ كىۋانىت فىزىكىسى ئاساسى',
                    topics: [
                        { category: '🔹 كىۋانىت مانا', items: ['Classical Bit vs Qubit پەرقى', '|0⟩ ۋە |1⟩ ھالەت كۆرسەتكۈچى', 'Bloch Sphere تەسەۋۋۇرى'] },
                        { category: '🔹 ئۆلچەش سىستېمىسى', items: ['State Vector ئۆزگىرىشى', 'Measurement & Collapse ئېففېكتى'] }
                    ]
                },
                {
                    id: 'quantum-programming',
                    title: '3️⃣ كىۋانىت پروگراممىلاش',
                    topics: [
                        { category: '🔹 ئەملىي پلاتفورمىلار', items: ['Qiskit كۇتۇپخانىسى پىششىقلاش', 'Aer Simulator سىناقلىرى', 'IBM Quantum Cloud بىلەن ئۇلىنىش'] },
                        { category: '🔹 PennyLane (Hybrid ML)', items: ['Quantum Neural Networks (QNN)', 'Gradient Calculation ھېسابلاش'] }
                    ]
                }
            ];

            return (
                <div className="min-h-screen relative flex flex-col z-10 select-none">
                    <canvas ref={canvasRef} className="fixed inset-0 w-full h-full pointer-events-none z-0" />
                    
                    {/* ئۇستۈنكى تاختاي */}
                    <nav className={`sticky top-0 z-50 backdrop-blur-md border-b transition-colors ${darkMode ? 'bg-gray-900/80 border-gray-800' : 'bg-white/80 border-gray-200'}`}>
                        <div className="container mx-auto px-4 py-4 flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="p-2 rounded-xl bg-cyan-500/10">
                                    <Icons.Zap />
                                </div>
                                <div>
                                    <h1 className="text-lg font-bold">QML 2026</h1>
                                    <p className="text-[10px] opacity-60">Quantum Machine Learning Roadmap</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-3">
                                <button 
                                    onClick={() => document.getElementById('reg-form')?.scrollIntoView({ behavior: 'smooth' })}
                                    className="text-xs px-4 py-2 rounded-xl font-bold bg-cyan-600 hover:bg-cyan-500 text-white shadow-xs cursor-pointer"
                                >
                                    ھازىر تىزىملىتىڭ
                                </button>
                                <button onClick={toggleTheme} className="p-2 rounded-xl border border-gray-700 bg-gray-800/20 cursor-pointer">
                                    {darkMode ? <Icons.Sun /> : <Icons.Moon />}
                                </button>
                            </div>
                        </div>
                    </nav>

                    {/* تېما قىسمى */}
                    <header className="container mx-auto px-4 py-12 text-center max-w-2xl relative z-10">
                        <div className="inline-flex p-3 rounded-full mb-4 bg-cyan-500/10">
                            <Icons.Atom />
                        </div>
                        <h2 className="text-2xl md:text-4xl font-bold mb-2 bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-purple-500">
                            كىۋانىت ماشىنا ئۆگىنىش كۇرسى
                        </h2>
                        <p className="text-xs opacity-70 leading-relaxed">
                            كەلگۈسى تېخنىكىلارنىڭ ئەڭ يۇقىرى چوققىسى بولغان كىۋانىت ھېسابلاش ۋە سۈنئىي ئەقىل بىرىكمىسىگە بىرلىكتە قەدەم قويىمىز.
                        </p>
                    </header>

                    {/* باھا تاختىسى */}
                    <section className="container mx-auto px-4 mb-8 max-w-3xl z-10">
                        <div className={`p-5 rounded-2xl border ${darkMode ? 'bg-gray-900/40 border-gray-800' : 'bg-white border-gray-200 shadow-sm'}`}>
                            <div className="grid grid-cols-3 gap-2 text-center text-xs mb-4">
                                <div className="p-2 rounded-xl bg-gray-800/20"><span className="block font-bold text-cyan-400">20%</span> ئەڭ يۇقىرى چېكىم</div>
                                <div className="p-2 rounded-xl bg-gray-800/20"><span className="block font-bold text-purple-400">20%</span> گۇرۇپپا ئېتىبارى</div>
                                <div className="p-2 rounded-xl bg-gray-800/20"><span className="block font-bold text-green-400">10%</span> ئالدىن تىزىملىتىش</div>
                            </div>
                            <div className="text-center p-3 rounded-xl bg-cyan-500/5 border border-cyan-500/20">
                                <span className="text-xs line-through text-gray-500 ml-2">$125</span>
                                <span className="text-xl font-bold text-cyan-400">$100</span>
                                <span className="text-[10px] text-green-500 font-bold mr-2">(ئېتىبار باھا)</span>
                            </div>
                        </div>
                    </section>

                    {/* تاللاش تۈرلىرى */}
                    <div className="container mx-auto px-4 mb-4 max-w-3xl z-10">
                        <div className="flex flex-wrap gap-1.5 justify-center p-1 rounded-xl bg-gray-900/40 border border-gray-800">
                            {roadmap.map(sec => (
                                <button
                                    key={sec.id}
                                    onClick={() => setActiveSection(sec.id)}
                                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition cursor-pointer ${activeSection === sec.id 
                                        ? 'bg-cyan-600 text-white'
                                        : 'text-gray-400 hover:text-gray-200'
                                    }`}
                                >
                                    {sec.title.split(' ')[0]}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* مەزمۇنلار */}
                    <main className="container mx-auto px-4 mb-12 max-w-3xl flex-grow z-10">
                        {roadmap.map(sec => (
                            sec.id === activeSection && (
                                <div key={sec.id} className="p-5 rounded-2xl border border-gray-800 bg-gray-900/60 fade-in">
                                    <h3 className="text-sm font-bold mb-4 text-cyan-400">{sec.title}</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {sec.topics.map((topic, idx) => (
                                            <div key={idx} className="p-4 rounded-xl bg-gray-950/40 border border-gray-800/60">
                                                <h4 className="font-bold text-xs text-purple-400 mb-2">{topic.category}</h4>
                                                <ul className="space-y-1.5 text-xs opacity-80">
                                                    {topic.items.map((item, i) => (
                                                        <li key={i} className="flex items-center gap-1.5">
                                                            <Icons.ChevronLeft />
                                                            <span>{item}</span>
                                                        </li>
                                                    ))}
                                                </ul>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )
                        ))}
                    </main>

                    {/* تىزىملىتىش جەدۋىلى */}
                    <section id="reg-form" className="container mx-auto px-4 mb-16 max-w-xl z-10">
                        <div className="p-6 rounded-2xl border border-gray-800 bg-gray-900/90 shadow-xl">
                            <h3 className="text-base font-bold text-center mb-4">ئالدىن تىزىملىتىش جەدۋىلى</h3>
                            
                            {submitted ? (
                                <div className="text-center py-6 text-green-400 font-bold text-xs">
                                    ✓ ئۇچۇرىڭىز سىستېمىغا مۇۋەپپەقىيەتلىك يوللاندى!
                                </div>
                            ) : (
                                <form onSubmit={handleSubmit} className="space-y-3.5">
                                    <div>
                                        <label className="block mb-1 text-xs opacity-75">تولۇق ئىسمىڭىز</label>
                                        <input type="text" required className="w-full px-3 py-2 text-xs rounded-lg border border-gray-800 bg-gray-950 focus:border-cyan-500 focus:outline-hidden" placeholder="ئىسمىڭىز" />
                                    </div>
                                    <div>
                                        <label className="block mb-1 text-xs opacity-75">ئېلېكترونلۇق خەت (Email)</label>
                                        <input type="email" required className="w-full px-3 py-2 text-xs text-left rounded-lg border border-gray-800 bg-gray-950 focus:border-cyan-500 focus:outline-hidden" placeholder="example@mail.com" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block mb-1 text-xs opacity-75">Telegram</label>
                                            <input type="text" required className="w-full px-3 py-2 text-xs text-left rounded-lg border border-gray-800 bg-gray-950 focus:border-cyan-500 focus:outline-hidden" placeholder="@username" />
                                        </div>
                                        <div>
                                            <label className="block mb-1 text-xs opacity-75">WhatsApp</label>
                                            <input type="text" className="w-full px-3 py-2 text-xs text-left rounded-lg border border-gray-800 bg-gray-950 focus:border-cyan-500 focus:outline-hidden" placeholder="+9055..." />
                                        </div>
                                    </div>
                                    <button type="submit" className="w-full py-2.5 rounded-xl text-xs font-bold text-white bg-gradient-to-r from-cyan-600 to-blue-600 shadow-md cursor-pointer hover:opacity-90">
                                        مەلۇماتلارنى جەزملەش
                                    </button>
                                </form>
                            )}
                        </div>
                    </section>

                    <footer className="py-4 text-center text-[10px] opacity-40 mt-auto border-t border-gray-900">
                        <p>© 2026 KelBil Tech. بارلىق ھوقۇق قوغدىلىدۇ.</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<QuantumRoadmap2026 />);
    </script>
</body>
</html>
