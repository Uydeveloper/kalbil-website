<!DOCTYPE html>
<html lang="ug">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ئاساسىي توسۇلۇلار - KaLBiL</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 { 
            color: #2563eb; 
            text-align: center;
            border-bottom: 3px solid #2563eb;
            padding-bottom: 10px;
        }
        .content { 
            line-height: 1.8; 
            font-size: 16px;
        }
        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ئاساسىي توسۇلۇلار - ئىستاتىستىكا</h1>
        
        <div class="content">
            <h2>كىرىش سۆز</h2>
            <p>بۇ دەرسلىكتە ئىستاتىستىكا ئاساسىي توسۇلۇللىرى ھەققىدە تەپسىلىي مەلۇماتلار بار.</p>
            
            <h2>ئاساسىي ئۇقۇملار</h2>
            <ul>
                <li>سانلىق مەلۇمات توپلاش</li>
                <li>مەلۇماتلارنى تەھلىل قىلىش</li>
                <li>نەتىجىلەرنى چۈشەندۈرۈش</li>
            </ul>
            
            <h2>مىساللار</h2>
            <p>بۇ يەردە ئەمەلىي مىساللار كۆرۈلىدۇ...</p>
        </div>
        
        <a href="javascript:window.close()" class="back-btn">بەتنى يېپىش</a>
    </div>
</body>
</html>
